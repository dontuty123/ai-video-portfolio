<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pham Tri Thuc · AI Video Portfolio</title>
<meta name="description" content="Pham Tri Thuc — AI Video Creator · AI Film Production. Portfolio 2026.">
<meta property="og:title" content="Pham Tri Thuc · AI Video Portfolio">
<meta property="og:description" content="AI Video Creator · AI Film Production">
<meta property="og:image" content="cover.jpg">
<style>
:root{--bg:#0e1014;--panel:#161a21;--line:#2a2f38;--ink:#ece8e1;--muted:#a7a39b;--gold:#c9a46a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.hero{position:relative;min-height:62vh;display:flex;align-items:flex-end;padding:48px 16px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,var(--bg))}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;width:100%}
.kicker{color:var(--gold);font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(38px,7vw,72px);margin:10px 0 6px}
.sub{color:var(--muted);font-size:18px;margin:0 0 26px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:30px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--panel)}
.btn.main{background:var(--gold);color:#14110c;border-color:var(--gold)}
.btn:hover{filter:brightness(1.1)}
main{max-width:1100px;margin:0 auto;padding:0 16px 48px}
.viewer{width:100%;aspect-ratio:16/9;border:1px solid var(--line);background:var(--panel)}
.viewer iframe{width:100%;height:100%;border:0;display:block}
.note{color:var(--muted);font-size:14px;margin:12px 0 0}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:center;padding:24px 16px}
footer a{color:var(--gold)}
@media (max-width:700px){.viewer{display:none}}
</style>
</head>
<body>
<header class="hero">
  <img src="cover.jpg" alt="">
  <div class="wrap">
    <div class="kicker">AI Video Portfolio · 2026</div>
    <h1>Pham Tri Thuc</h1>
    <p class="sub">AI Video Creator · AI Film Production</p>
    <div class="btns">
      <a class="btn main" href="Pham-Tri-Thuc-Portfolio.pdf" target="_blank" rel="noopener">Open portfolio (PDF)</a>
      <a class="btn" href="Pham-Tri-Thuc-Portfolio.pdf" download>Download PDF</a>
      <a class="btn" href="https://youtu.be/3UTPcsP1dyQ" target="_blank" rel="noopener">▶ Watch The Titanic</a>
    </div>
  </div>
</header>
<main>
  <div class="viewer"><iframe src="Pham-Tri-Thuc-Portfolio.pdf#view=FitH" title="Portfolio PDF"></iframe></div>
  <p class="note">If the viewer does not load, use “Open portfolio (PDF)” above.</p>
</main>
<footer>
  <a href="mailto:pthuc0123@gmail.com">pthuc0123@gmail.com</a> · 0989 901 328 · Ho Chi Minh City
</footer>
</body>
</html>
